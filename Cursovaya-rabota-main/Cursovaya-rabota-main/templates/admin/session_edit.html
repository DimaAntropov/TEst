{% extends 'base.html' %}{% block title %}Изменение сеанса{% endblock %}{% block content %}{% include 'admin/_nav.html' %}<div class="auth-card wide"><h1>Изменить сеанс</h1><p class="muted">Проверьте, что новое время не пересекается с другим сеансом.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Фильм<select name="movie_id" required>{% for m in movies %}<option value="{{ m['id'] }}" {% if m['id']==item['movie_id'] %}selected{% endif %}>{{ m['title'] }} ({{ m['duration'] }} мин)</option>{% endfor %}</select></label><label>Зал<select name="hall_id" required>{% for h in halls %}<option value="{{ h['id'] }}" {% if h['id']==item['hall_id'] %}selected{% endif %}>{{ h['name'] }}</option>{% endfor %}</select></label><label>Начало<input type="datetime-local" name="start_time" value="{{ item['start_time'] }}" required></label><label>Цена, ₽<input type="number" name="price" min="0" step="0.01" value="{{ item['price'] }}" required></label><div><button>Сохранить</button> <a class="button secondary" href="{{ url_for('admin.sessions') }}">Отмена</a></div></form></div>{% endblock %}

{% extends 'base.html' %}{% block title %}Фильмы{% endblock %}{% block content %}{% include 'admin/_nav.html' %}<div class="page-head"><div><h1>Фильмы</h1><p>Справочник кинокартин.</p></div></div><div class="admin-grid"><form method="post" class="panel stack"><h2>Добавить фильм</h2><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Название<input name="title" required></label><label>Жанр<input name="genre" required></label><label>Длительность, мин<input type="number" name="duration" min="1" max="600" required></label><label>Описание<textarea name="description" rows="4"></textarea></label><button>Добавить</button></form><div class="panel table-wrap"><table><thead><tr><th>Название</th><th>Жанр</th><th>Мин.</th><th></th></tr></thead><tbody>{% for m in movies %}<tr><td><b>{{ m['title'] }}</b></td><td>{{ m['genre'] }}</td><td>{{ m['duration'] }}</td><td class="actions"><a href="{{ url_for('admin.movie_edit',item_id=m['id']) }}">Изменить</a><form method="post" action="{{ url_for('admin.admin_movie_delete',item_id=m['id']) }}" onsubmit="return confirm('Удалить фильм?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="text-danger">Удалить</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}

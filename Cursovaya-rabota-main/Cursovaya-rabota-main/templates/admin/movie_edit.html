{% extends 'base.html' %}{% block title %}Изменение фильма{% endblock %}{% block content %}{% include 'admin/_nav.html' %}<div class="auth-card wide"><h1>Изменить фильм</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Название<input name="title" value="{{ item['title'] }}" required></label><label>Жанр<input name="genre" value="{{ item['genre'] }}" required></label><label>Длительность<input type="number" name="duration" value="{{ item['duration'] }}" min="1" required></label><label>Описание<textarea name="description" rows="5">{{ item['description'] }}</textarea></label><div><button>Сохранить</button> <a class="button secondary" href="{{ url_for('admin.movies') }}">Отмена</a></div></form></div>{% endblock %}

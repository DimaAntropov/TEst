{% extends 'base.html' %}{% block title %}Изменение зала{% endblock %}{% block content %}{% include 'admin/_nav.html' %}<div class="auth-card"><h1>Изменить зал</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Название<input name="name" value="{{ item['name'] }}" required></label><label>Количество рядов<input type="number" name="rows_count" value="{{ item['rows_count'] }}" min="1" max="30" required></label><label>Мест в ряду<input type="number" name="seats_per_row" value="{{ item['seats_per_row'] }}" min="1" max="40" required></label><div><button>Сохранить</button> <a class="button secondary" href="{{ url_for('admin.halls') }}">Отмена</a></div></form></div>{% endblock %}
